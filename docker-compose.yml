name: bhumipedia-rag

x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
    args:
      TORCH_VARIANT: ${TORCH_VARIANT:-cpu}
  image: bhumipedia-rag:latest
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-bhumipedia}:${POSTGRES_PASSWORD:-bhumipedia}@postgres:5432/${POSTGRES_DB:-bhumipedia}
    REDIS_URL: redis://redis:6379/0
    HF_HOME: /models
  volumes:
    - model_cache:/models   # BGE weights downloaded once, reused across restarts
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bhumipedia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bhumipedia}
      POSTGRES_DB: ${POSTGRES_DB:-bhumipedia}
    command: ["postgres", "-c", "shared_buffers=512MB", "-c", "maintenance_work_mem=512MB"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # One-shot: applies migrations, then exits. api/worker wait for it.
  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  api:
    <<: *app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "${API_WORKERS:-1}",
              "--proxy-headers", "--forwarded-allow-ips", "*"]
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      start_period: 120s
      retries: 5

  worker:
    <<: *app
    command: ["python", "-m", "app.workers.sync"]
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
  model_cache:
