[project]
name = "bhumipedia-rag"
version = "0.1.0"
description = "Bengali land-law / public-service RAG chatbot grounded in Bhumipedia sources"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0.30",
    "psycopg[binary,pool]>=3.2",
    "alembic>=1.13",
    "pgvector>=0.3",
    "httpx>=0.27",
    "redis>=5.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "sentence-transformers>=3.0",
    "langchain-core>=0.3",
    "langchain-huggingface>=0.1",
    "langchain-groq>=0.2",
    "langchain-text-splitters>=0.3",
    "transformers>=4.44",
    "torch>=2.3",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21", "ruff>=0.5"]

[tool.uv]
# CPU-only torch wheels by default (no multi-GB CUDA libraries on laptops).
# For GPU hosts, see README "GPU deployment".
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: requires a running PostgreSQL+pgvector (TEST_DATABASE_URL)",
    "models: loads real BGE models (slow, downloads weights)",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]
